<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renta de inflables</title>
  <meta name="description" content="Catálogo y apartados de renta de inflables a domicilio." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/renta.css" />
</head>
<body class="renta-page">

  <!-- Sprite de íconos reutilizable -->
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/>
    </symbol>
    <symbol id="i-balloon" viewBox="0 0 24 24" fill="currentColor">
      <ellipse cx="12" cy="8.5" rx="5.5" ry="6.5"/>
      <path d="M11 15h2l-.6 2.2h-.8z"/>
      <path d="M12 17.5c0 2 1.6 2 1.6 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v4M16 3v4"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
    </symbol>
    <symbol id="i-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21c4-4.5 7-8 7-11a7 7 0 0 0-14 0c0 3 3 6.5 7 11z"/><circle cx="12" cy="10" r="2.5"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h3l1.5 5-2 1.5a12 12 0 0 0 6 6l1.5-2 5 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7.5l8 5.5 8-5.5"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.28.86 5.84 2.42a8.2 8.2 0 0 1 2.42 5.83c0 4.54-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43l-.48-.01c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/>
    </symbol>
    <symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 17H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h8v12z"/>
      <path d="M10 9h5l3 3v3a2 2 0 0 1-2 2h-2"/>
      <circle cx="7.5" cy="17.5" r="1.5"/>
      <circle cx="15.5" cy="17.5" r="1.5"/>
    </symbol>
  </svg>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="#inicio">
        <img src="assets/logo.svg" alt="" width="40" height="40" />
        <span class="logo-text" id="brand-name"></span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Abrir menú">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <nav class="main-nav" id="main-nav"></nav>
    </div>
  </header>

  <main>
    <section id="inicio" class="hero hero--renta">
      <span class="conf conf--1" aria-hidden="true"></span>
      <span class="conf conf--2" aria-hidden="true"></span>
      <span class="conf conf--3" aria-hidden="true"></span>
      <span class="conf conf--4" aria-hidden="true"></span>
      <span class="conf conf--5" aria-hidden="true"></span>
      <span class="conf conf--6" aria-hidden="true"></span>
      <svg class="hero-balloon hero-balloon--a" aria-hidden="true"><use href="#i-balloon"/></svg>
      <svg class="hero-balloon hero-balloon--b" aria-hidden="true"><use href="#i-balloon"/></svg>
      <svg class="hero-balloon hero-balloon--c" aria-hidden="true"><use href="#i-balloon"/></svg>
      <div class="container hero-inner" id="hero-content"></div>
    </section>

    <section id="catalogo" class="section scallop-top">
      <div class="container">
        <div class="section-head reveal" id="catalogo-head"></div>
        <div class="rental-grid" id="catalogo-grid"></div>
      </div>
    </section>

    <section id="como-funciona" class="section section--alt scallop-top">
      <div class="container">
        <div class="section-head reveal" id="como-funciona-head"></div>
        <div class="steps-grid" id="steps-grid"></div>
      </div>
    </section>

    <section id="fechas" class="section scallop-top">
      <div class="container">
        <div class="section-head reveal" id="fechas-head"></div>
        <div class="reserve-layout renta-layout">
          <div class="calendar-card reveal">
            <div class="reserve-note" id="fechas-note"></div>
            <div class="calendar-legend" id="calendar-legend"></div>
            <div class="calendar-header">
              <button type="button" id="cal-prev" aria-label="Mes anterior">‹</button>
              <span id="calendar-month-label"></span>
              <button type="button" id="cal-next" aria-label="Mes siguiente">›</button>
            </div>
            <div class="calendar-weekdays">
              <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <p class="selection-summary" id="selection-summary"></p>
          </div>

          <div class="form-card reveal" id="solicitud">
            <div class="form-intro" id="form-head"></div>
            <form id="rental-form" novalidate></form>
          </div>
        </div>
      </div>
    </section>

    <section id="cobertura" class="section section--alt scallop-top">
      <div class="container">
        <div class="section-head reveal" id="cobertura-head"></div>
        <div class="coverage-card card reveal" id="coverage-card"></div>
      </div>
    </section>

    <section id="preguntas" class="section scallop-top">
      <div class="container">
        <div class="section-head reveal" id="faq-head"></div>
        <div class="faq-list" id="faq-list"></div>
      </div>
    </section>

    <section id="contacto" class="section section--alt scallop-top">
      <div class="container">
        <div class="section-head reveal" id="contacto-head"></div>
        <div class="contact-grid" id="contacto-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer scallop-top">
    <div class="container">
      <div class="brand">
        <img src="assets/logo.svg" alt="" width="32" height="32" />
        <span class="logo-text" id="footer-brand"></span>
      </div>
      <p id="footer-copy"></p>
    </div>
  </footer>

  <a class="whatsapp-fab" id="whatsapp-fab" href="#" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp">
    <svg aria-hidden="true"><use href="#i-whatsapp"/></svg>
  </a>

  <script src="js/renta.js" defer></script>
</body>
</html>
